services:
  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_SHOP_NAME: ${SHOP_NAME:-Byteflix}
        NEXT_PUBLIC_SHOP_DISCORD_URL: ${SHOP_DISCORD_URL:-}
        NEXT_PUBLIC_PLEX_ENABLED: ${PLEX_ENABLED:-false}
        NEXT_PUBLIC_AZTECO_ENABLED: ${AZTECO_ENABLED:-false}
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_SHOP_NAME: ${SHOP_NAME:-Byteflix}
      NEXT_PUBLIC_SHOP_DISCORD_URL: ${SHOP_DISCORD_URL:-}
      NEXT_PUBLIC_PLEX_ENABLED: ${PLEX_ENABLED:-false}
      NEXT_PUBLIC_AZTECO_ENABLED: ${AZTECO_ENABLED:-false}
    # Set BIND_HOST=127.0.0.1 in .env to expose only to a local reverse proxy.
    ports:
      - "${BIND_HOST:-0.0.0.0}:3000:3000"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - edge

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@postgres:5432/payment_portal
      REDIS_URL: redis://redis:6379
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:4000}
    ports:
      - "${BIND_HOST:-0.0.0.0}:4000:4000"
    # jfa-go usually runs as its own container on this host. Reach it via the
    # host gateway (JFA_GO_BASE_URL=http://host.docker.internal:8056), or start
    # the bundled instance with: docker compose --profile bundled-jfa up -d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    # `default` keeps the legacy infra_default network alive; `portal-net` is
    # the shared network external containers (Discord bot) use to reach the
    # api (deploy.sh creates it if missing).
    networks:
      - default
      - edge
      - backend
      - portal-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: payment_portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # No host port mapping: only reachable from the backend network.
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port mapping: only reachable from the backend network.
    networks:
      - backend

  # Optional bundled jfa-go for fresh setups without an existing instance:
  #   docker compose --profile bundled-jfa up -d jfa-go
  # The default deployment expects an EXTERNAL jfa-go on the host (see api).
  jfa-go:
    image: hrfee/jfa-go:latest
    profiles: ["bundled-jfa"]
    volumes:
      - jfa_go_data:/data
    restart: unless-stopped
    ports:
      - "127.0.0.1:8056:8056"
    networks:
      - edge
      - backend

networks:
  default:
  edge:
  backend:
    internal: true
  # Shared with external containers (Discord bot). Created by deploy.sh /
  # `docker network create portal-net` — external so compose never fights
  # over its ownership labels.
  portal-net:
    external: true
    name: portal-net

volumes:
  postgres_data:
  jfa_go_data:
