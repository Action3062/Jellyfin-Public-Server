services:
  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_SHOP_NAME: ${SHOP_NAME:-Arkiv3}
        NEXT_PUBLIC_SHOP_DISCORD_URL: ${SHOP_DISCORD_URL:-}
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_SHOP_NAME: ${SHOP_NAME:-Arkiv3}
      NEXT_PUBLIC_SHOP_DISCORD_URL: ${SHOP_DISCORD_URL:-}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - edge

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://portal:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@postgres:5432/payment_portal
      REDIS_URL: redis://redis:6379
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:4000}
    ports:
      - "4000:4000"
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - jfa-go
    networks:
      - edge
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: payment_portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # No host port mapping: only reachable from the backend network.
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port mapping: only reachable from the backend network.
    networks:
      - backend

  jfa-go:
    image: hrfee/jfa-go:latest
    volumes:
      - jfa_go_data:/data
    restart: unless-stopped
    # Customers need the jfa-go registration form (invite links), so bind to
    # localhost and publish it through your reverse proxy / TLS terminator as
    # JFA_GO_EXTERNAL_URL. Never expose 0.0.0.0:8056 directly — the same port
    # serves the admin API.
    ports:
      - "127.0.0.1:8056:8056"
    networks:
      - edge
      - backend

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  jfa_go_data:
